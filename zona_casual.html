<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>zona_casual</title>
    <style>
      :root { --yellow: #f7bd00; --ink: #111111; --paper: #f7f6f1; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Inter, Arial, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      .label { position: fixed; left: 32px; top: 30px; z-index: 2; display: inline-flex; align-items: center; min-height: 48px; border: 4px solid var(--ink); border-radius: 28px; background: var(--ink); color: #fff; font-size: 18px; font-weight: 900; text-transform: lowercase; box-shadow: 0 18px 34px rgba(17, 17, 17, 0.12); }
      .label span { display: grid; place-items: center; width: 52px; height: 52px; margin: -6px 10px -6px -6px; border: 5px solid var(--ink); border-radius: 50%; background: var(--yellow); color: var(--ink); font-size: 20px; }
      .label b { padding-right: 22px; }
    </style>
  </head>
  <body>
    <div class="label"><span>◆</span><b>zona_casual</b></div>
    <canvas id="stage"></canvas>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf7f6f1);
      const camera = new THREE.OrthographicCamera(-6, 6, 4, -4, 0.1, 100);
      camera.position.set(4.8, 5.2, 4.9);
      camera.lookAt(0, 0.35, 0);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0.42, 0);
      controls.minZoom = 0.78;
      controls.maxZoom = 2.6;
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d1c4, 1.9));
      const sun = new THREE.DirectionalLight(0xffffff, 2.35);
      sun.position.set(6, 12, 5);
      scene.add(sun);
      new GLTFLoader().load("assets/models/zones/zona_casual.glb?v=20260512_base_01", (gltf) => scene.add(gltf.scene));
      function resize() {
        const width = window.innerWidth, height = window.innerHeight;
        renderer.setSize(width, height, false);
        const aspect = width / height, frustum = width < 760 ? 3.55 : 2.72;
        camera.left = -frustum * aspect; camera.right = frustum * aspect; camera.top = frustum; camera.bottom = -frustum; camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize); resize();
      function animate() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate); }
      animate();
    </script>
  </body>
</html>
