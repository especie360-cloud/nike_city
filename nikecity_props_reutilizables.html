<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nike City props reutilizables</title>
    <style>
      :root { --yellow: #f7bd00; --ink: #111111; --paper: #f7f6f1; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Inter, Arial, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      .label { position: fixed; left: 28px; top: 26px; z-index: 2; display: inline-flex; align-items: center; min-height: 48px; border: 4px solid var(--ink); border-radius: 28px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 900; text-transform: lowercase; box-shadow: 0 18px 34px rgba(17, 17, 17, 0.12); }
      .label span { display: grid; place-items: center; width: 52px; height: 52px; margin: -6px 10px -6px -6px; border: 5px solid var(--ink); border-radius: 50%; background: var(--yellow); color: var(--ink); font-size: 18px; }
      .label b { padding-right: 22px; }
      .status { position: fixed; left: 32px; bottom: 28px; z-index: 2; max-width: min(560px, calc(100vw - 64px)); padding: 14px 18px; border: 2px solid rgba(17, 17, 17, 0.12); border-radius: 14px; background: rgba(247, 246, 241, 0.92); color: var(--ink); font-size: 13px; font-weight: 800; line-height: 1.35; box-shadow: 0 12px 28px rgba(17, 17, 17, 0.08); }
      .status:empty { display: none; }
    </style>
  </head>
  <body>
    <div class="label"><span>◎</span><b>props_reutilizables</b></div>
    <div class="status" id="status"></div>
    <canvas id="stage"></canvas>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      const canvas = document.querySelector("#stage");
      const status = document.querySelector("#status");
      if (location.protocol === "file:") {
        status.textContent = "Abre este preview desde http://localhost:4174/nikecity_props_reutilizables.html para cargar los GLB.";
      }
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf7f6f1);
      const camera = new THREE.OrthographicCamera(-6, 6, 4, -4, 0.1, 100);
      camera.position.set(5.8, 6.2, 5.2); camera.lookAt(0, 0.25, 0);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 0.35, 0); controls.minZoom = 0.7; controls.maxZoom = 3.4;
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d1c4, 1.9));
      const sun = new THREE.DirectionalLight(0xffffff, 2.35); sun.position.set(6, 12, 5); scene.add(sun);
      const manager = new THREE.LoadingManager();
      const loader = new GLTFLoader(manager);
      const failed = [];
      const props = [
        ["prop_tree_yellow.glb", [-5.3, 0.55, 0], 1],
        ["prop_tree_white.glb", [-4.45, 0.55, 0], 1],
        ["prop_tree_cone.glb", [-3.6, 0.55, 0], 1],
        ["prop_umbrella.glb", [-2.65, 0.55, 0], 1],
        ["prop_lamp.glb", [-1.8, 0.55, 0], 1],
        ["prop_bench.glb", [-0.95, 0.55, 0], 1],
        ["prop_nike_sign.glb", [0.05, 0.55, 0], 1],
        ["prop_flag.glb", [1.0, 0.55, 0], 1],
        ["prop_bollard.glb", [1.85, 0.55, 0], 1],
        ["prop_fountain.glb", [2.7, 0.55, 0], 1],
        ["prop_parking_sign.glb", [3.55, 0.55, 0], 1],
        ["prop_traffic_light.glb", [4.4, 0.55, 0], 1],
        ["prop_bicycle_yellow.glb", [5.3, 0.55, 0], 1],
        ["prop_bicycle_white.glb", [6.15, 0.55, 0], 1],
      ];
      status.textContent = `Cargando ${props.length} props...`;
      manager.onProgress = (url, loaded, total) => {
        status.textContent = `Cargando props ${loaded}/${total}...`;
      };
      manager.onLoad = () => {
        status.textContent = failed.length ? `No cargaron: ${failed.join(", ")}` : "";
      };
      manager.onError = (url) => {
        failed.push(url.split("/").pop().split("?")[0]);
      };
      props.forEach(([file, pos, scale]) => {
        loader.load(`assets/models/props/${file}?v=20260512_props_traffic_bike_04`, (gltf) => {
          gltf.scene.position.set(pos[0], pos[1], pos[2]);
          gltf.scene.scale.setScalar(scale);
          scene.add(gltf.scene);
        }, undefined, (error) => {
          if (!failed.includes(file)) failed.push(file);
          status.textContent = `No se pudo cargar ${file}.`;
          console.error(error);
        });
      });
      function resize() {
        const width = window.innerWidth, height = window.innerHeight;
        renderer.setSize(width, height, false);
        const aspect = width / height, frustum = width < 760 ? 5.0 : 3.85;
        camera.left = -frustum * aspect; camera.right = frustum * aspect; camera.top = frustum; camera.bottom = -frustum; camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize); resize();
      function animate() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate); }
      animate();
    </script>
  </body>
</html>
